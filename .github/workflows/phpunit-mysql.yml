name: Full stack (PHPUnit, browser, HTTPS)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  full-stack:
    name: Cloud-equivalent stack (PHP 8.4)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: phoenix_test
          MYSQL_USER: phoenix
          MYSQL_PASSWORD: phoenix
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out test repo
        uses: actions/checkout@v5

      - name: Verify shell scripts are executable in git
        run: bash scripts/verify-shell-script-modes.sh

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, mysqli
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install OS packages
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client apache2 libapache2-mod-php openssl
          sudo a2enmod ssl
          sudo a2enmod php8.4 2>/dev/null || sudo a2enmod php8.3
          sudo mkdir -p /run/lock/apache2 /var/run/apache2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Clone CE PhoenixCart at pinned ref
        run: bash scripts/clone-catalog.sh
        env:
          PHOENIX_CART_ROOT: ${{ github.workspace }}/PhoenixCart

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Import fixture SQL
        env:
          PHOENIX_DB_HOST: 127.0.0.1
          PHOENIX_DB_PORT: 3306
          PHOENIX_DB_NAME: phoenix_test
          PHOENIX_DB_USER: phoenix
          PHOENIX_DB_PASSWORD: phoenix
        run: bash fixtures/import-mysql-fixtures.sh

      - name: Run full stack
        env:
          PHOENIX_CART_ROOT: ${{ github.workspace }}/PhoenixCart
          PHOENIX_MYSQL_ENABLED: '1'
          PHOENIX_DB_HOST: 127.0.0.1
          PHOENIX_DB_PORT: 3306
          PHOENIX_DB_NAME: phoenix_test
          PHOENIX_DB_USER: phoenix
          PHOENIX_DB_PASSWORD: phoenix
          PHOENIX_HTTP_ENABLED: '1'
          PHOENIX_HTTP_BASE_URL: http://127.0.0.1:8765
          PHOENIX_HTTP_HOST: 127.0.0.1
          PHOENIX_HTTP_PORT: '8765'
          PHOENIX_BROWSER_ENABLED: '1'
          PHOENIX_HTTPS_ENABLED: '1'
          PHOENIX_HTTPS_BASE_URL: https://127.0.0.1:8443
        run: bash scripts/full-stack-test.sh
